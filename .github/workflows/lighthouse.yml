name: Lighthouse CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'dashboard/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun

      - name: Build visual dashboard
        if: always()
        run: node scripts/build-dashboard.js

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.run_number }}
          path: lhci-reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload visual dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-quality-dashboard-${{ github.run_number }}
          path: dashboard/
          if-no-files-found: warn
          retention-days: 90

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload dashboard to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy dashboard to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
